name: API CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Composer Validate & Laravel Pint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Laravel Pint)
        run: vendor/bin/pint --test

  tests:
    name: PHPUnit (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: titkul_canteen_test
          POSTGRES_USER: demo_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U demo_user -d titkul_canteen_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run migrations and PHPUnit suite
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titkul_canteen_test
          DB_USERNAME: demo_user
          DB_PASSWORD: ci_test_password
        run: |
          php artisan migrate --force
          php artisan test --compact

  security-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Audit locked Composer dependencies
        run: composer audit --locked --no-interaction

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [code-quality, tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production app image target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          load: true
          push: false
          tags: smart-canteen-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production image security and runtime
        run: |
          USER_NAME=$(docker run --rm --entrypoint id smart-canteen-api:ci -un)
          echo "Container user: $USER_NAME"
          test "$USER_NAME" = "appuser"
          docker run --rm --entrypoint sh smart-canteen-api:ci -c '! command -v composer'
          docker run --rm --entrypoint php smart-canteen-api:ci artisan --version
