services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DEMO_LOGIN_ENABLED: "false"
      OPCACHE_VALIDATE_TIMESTAMPS: "0"
    volumes: !reset []

  nginx:
    image: !reset null
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    volumes: !reset []
