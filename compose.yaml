services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-titkul_canteen_demo}
      POSTGRES_USER: ${DB_USERNAME:-demo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo_secret_local}
      POSTGRES_TEST_DB: titkul_canteen_test
    ports:
      - "${DB_FORWARD_PORT:-54329}:5432"
    volumes:
      - api_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-demo_user} -d ${DB_DATABASE:-titkul_canteen_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-titkul_canteen_demo}
      DB_USERNAME: ${DB_USERNAME:-demo_user}
      DB_PASSWORD: ${DB_PASSWORD:-demo_secret_local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://h5.zdn.vn}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      LOG_CHANNEL: stderr
    volumes:
      - ./:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  api_pgdata:
  api_vendor:
